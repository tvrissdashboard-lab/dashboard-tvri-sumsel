<!-- Halaman ini KHUSUS ADMIN, dipakai untuk mendaftarkan akun login baru.
     Sengaja TIDAK ditautkan di navigasi dashboard mana pun -- buka langsung
     lewat alamatnya (mis. https://domain-anda/admin-register.html) hanya
     saat perlu menambah akun. Perlindungan sesungguhnya BUKAN dari
     tersembunyinya alamat ini, tapi dari ADMIN_REGISTER_KEY yang harus
     cocok dengan yang di-set di Code.gs (Apps Script). -->
<!DOCTYPE html>
<html lang="id" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftarkan Akun — Dashboard TVRI Sumsel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#FFFFFF; --bg2:#EEF5FF; --bg3:#E3EDFA;
    --text:#121732; --text-dim:#4C5578; --text-faint:#7E88AC;
    --glass:rgba(255,255,255,0.40); --glass-strong:rgba(255,255,255,0.60);
    --glass-border:rgba(20,50,110,0.10); --glass-hi:rgba(255,255,255,0.85);
    --cyan:#00B8CC; --electric:#2F6FEF; --blue:#0B4DA1;
    --coral:#E0503F; --mint:#12B893;
    --shadow:0 20px 50px rgba(30,60,130,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    color:var(--text); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
    background:
      radial-gradient(circle at 15% 10%, color-mix(in srgb, var(--electric) 26%, transparent), transparent 45%),
      radial-gradient(circle at 85% 15%, color-mix(in srgb, var(--cyan) 22%, transparent), transparent 45%),
      linear-gradient(160deg, var(--bg1), var(--bg2) 55%, var(--bg3));
  }
  .glass{
    background:var(--glass); backdrop-filter:blur(22px) saturate(160%); -webkit-backdrop-filter:blur(22px) saturate(160%);
    border:1px solid var(--glass-border); border-radius:24px; box-shadow:var(--shadow), inset 0 1px 0 var(--glass-hi);
  }
  .card{ width:100%; max-width:400px; padding:36px 32px 30px; text-align:center; }
  .logo{
    width:60px; height:60px; border-radius:16px; overflow:hidden; margin:0 auto 16px;
    background:linear-gradient(135deg,var(--cyan),var(--electric));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 26px color-mix(in srgb, var(--cyan) 50%, transparent);
  }
  .logo img{ width:100%; height:100%; object-fit:contain; padding:9px; }
  .title{ font-family:'Orbitron'; font-weight:700; font-size:15.5px; letter-spacing:.4px; }
  .sub{ font-size:11px; color:var(--text-faint); margin:6px 0 24px; letter-spacing:.4px; font-family:'IBM Plex Mono'; }
  .field{ text-align:left; margin-bottom:13px; }
  .field label{ display:block; font-family:'IBM Plex Mono'; font-size:10px; letter-spacing:.6px; text-transform:uppercase; color:var(--text-faint); margin-bottom:6px; }
  .field input, .field select{
    width:100%; padding:11px 14px; border-radius:12px; border:1px solid var(--glass-border);
    background:var(--glass-strong); color:var(--text); font-family:'Inter'; font-size:13.5px; outline:none;
  }
  .field input:focus, .field select:focus{ border-color:var(--cyan); }
  .btn{
    width:100%; margin-top:6px; padding:12px 14px; border:none; border-radius:12px;
    font-family:'Space Grotesk'; font-weight:700; font-size:13.5px; letter-spacing:.3px; color:#04101F; cursor:pointer;
    background:linear-gradient(120deg,var(--cyan),var(--electric));
    box-shadow:0 12px 28px color-mix(in srgb, var(--cyan) 35%, transparent);
  }
  .btn:disabled{ opacity:.6; cursor:not-allowed; }
  .msg{ font-size:11.5px; text-align:left; border-radius:10px; padding:9px 12px; margin-bottom:14px; display:none; }
  .msg.show{ display:block; }
  .msg.err{ color:var(--coral); background:color-mix(in srgb, var(--coral) 14%, transparent); border:1px solid color-mix(in srgb, var(--coral) 35%, transparent); }
  .msg.ok{ color:var(--mint); background:color-mix(in srgb, var(--mint) 14%, transparent); border:1px solid color-mix(in srgb, var(--mint) 35%, transparent); }
  .foot{ margin-top:20px; font-size:10px; color:var(--text-faint); font-family:'IBM Plex Mono'; letter-spacing:.4px; }
</style>
</head>
<body>
  <div class="glass card">
    <div class="logo">
      <img src="https://upload.wikimedia.org/wikipedia/commons/e/ec/TVRI_Sumatera_Selatan_2023.svg" alt="Logo TVRI Sumatera Selatan">
    </div>
    <div class="title">DAFTARKAN AKUN BARU</div>
    <div class="sub">DASHBOARD TVRI SUMATERA SELATAN &middot; KHUSUS ADMIN</div>
    <div class="msg" id="msg"></div>
    <form id="registerForm">
      <div class="field">
        <label for="username">Username akun baru</label>
        <input type="text" id="username" required>
      </div>
      <div class="field">
        <label for="password">Password akun baru</label>
        <input type="password" id="password" minlength="6" required>
      </div>
      <div class="field">
        <label for="role">Peran</label>
        <select id="role">
          <option value="viewer">Viewer (lihat data saja)</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div class="field">
        <label for="adminKey">Kode rahasia admin</label>
        <input type="password" id="adminKey" required>
      </div>
      <button type="submit" class="btn" id="btn">Daftarkan Akun</button>
    </form>
    <div class="foot">Kode rahasia harus sama dengan ADMIN_REGISTER_KEY di Apps Script</div>
  </div>

<script>
  // Samakan persis dengan API_URL di index.html.
  const API_URL = 'https://script.google.com/macros/s/AKfycbzM6KT1l2Pwb87WYRyNcp6AnsVynV9ApD0YEvcDO1rRj8A1AMf5OgrrnQzYpEA3WQ1Z6Q/exec';

  const form = document.getElementById('registerForm');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btn');

  function showMsg(text, ok){
    msg.textContent = text;
    msg.className = 'msg show ' + (ok ? 'ok' : 'err');
  }

  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    btn.disabled = true; btn.textContent = 'Mendaftarkan...';
    try{
      const res = await fetch(API_URL, {
        method:'POST',
        headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action:'register',
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value,
          role: document.getElementById('role').value,
          adminKey: document.getElementById('adminKey').value,
        })
      });
      const json = await res.json();
      if(json.error === 'FORBIDDEN') throw new Error('Kode rahasia admin salah.');
      if(json.error === 'USERNAME_SUDAH_ADA') throw new Error('Username sudah dipakai, pilih yang lain.');
      if(json.error === 'PASSWORD_TERLALU_PENDEK') throw new Error('Password minimal 6 karakter.');
      if(json.error) throw new Error(json.error);
      showMsg('Akun "' + json.username + '" berhasil didaftarkan.', true);
      form.reset();
    }catch(err){
      showMsg(err.message, false);
    }finally{
      btn.disabled = false; btn.textContent = 'Daftarkan Akun';
    }
  });
</script>
</body>
</html>
